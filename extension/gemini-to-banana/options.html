<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <title>Gemini to Banana Gallery</title>
    <style>
      body {
        color: #18181b;
        font: 14px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 24px;
        max-width: 560px;
      }

      label {
        display: grid;
        gap: 8px;
        margin: 16px 0;
      }

      input {
        border: 1px solid #d4d4d8;
        border-radius: 6px;
        font: inherit;
        padding: 8px;
      }

      button {
        background: #18181b;
        border: 0;
        border-radius: 6px;
        color: white;
        cursor: pointer;
        font: inherit;
        padding: 8px 12px;
      }

      #status {
        color: #166534;
        min-height: 20px;
      }
    </style>
  </head>
  <body>
    <h1>Gemini to Banana Gallery</h1>
    <label>
      Banana Gallery API 地址
      <input id="bananaApiOrigin" type="url" value="http://localhost:3333">
    </label>
    <button id="save" type="button">保存设置</button>
    <p id="status"></p>
    <script src="options.js"></script>
  </body>
</html>
