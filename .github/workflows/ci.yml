name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - plan-followup-ops

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      AUTH_MODE: local
      ALLOW_SERVER_SIDE_IMPORT: 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Test Python CLI contracts
        run: npm run test:gallery-client

      - name: Build
        run: npm run build

  cli-native:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m unittest discover -s tests -p "gallery_client_*_test.py"
